services:
  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      HN_DB_PATH: /app/data/hn.db
      HN_STORY_COUNT: "30"
    volumes:
      - hn-data:/app/data
    depends_on:
      - api
  api:
    build: .
    command: ["uvicorn","api:app","--host","0.0.0.0","--port","8000"]
    ports:
      - "8000:8000"
    environment:
      HN_DB_PATH: /app/data/hn.db
    volumes:
      - hn-data:/app/data
  collector:
    build: .
    profiles: ["tools"]
    command: ["python","-m","src.collect"]
    environment:
      HN_DB_PATH: /app/data/hn.db
    volumes:
      - hn-data:/app/data
volumes:
  hn-data:
