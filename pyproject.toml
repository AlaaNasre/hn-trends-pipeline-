[project]
name = "hn-trends-pipeline"
version = "2.0.0"
description = "Observable Hacker News snapshot pipeline and analytics dashboard"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
